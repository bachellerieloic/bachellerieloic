name: Metrics
on:
  schedule:
    - cron: "7 4 * * *"
    - cron: "7 16 * * *"
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metrics
      - name: Generate dashboard card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bachellerieloic
          template: classic
          filename: github-metrics.svg
          output_action: none
          config_timezone: America/Vancouver
          config_display: large
          config_padding: 0, 4
          config_order: base.header, base.activity+community, base.repositories, isocalendar
          base: header, activity, community, repositories
          base_indepth: no
          repositories_forks: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
      - name: Collect dashboard render
        run: |
          ls -la /metrics_renders || { echo "::error::renders folder missing"; exit 1; }
          cp /metrics_renders/github-metrics.svg ./github-metrics.svg
          echo "dashboard render: $(wc -c < github-metrics.svg) bytes"
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=bachellerieloic&layout=compact&langs_count=8&hide=html,css&size_weight=0.5&count_weight=0.5&theme=transparent&hide_border=true&custom_title=Most%20used%20languages&card_width=480
          path: top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          fail_on_error: true
      - name: Refuse to publish incomplete images
        run: |
          test -s github-metrics.svg || { echo "::error::github-metrics.svg was not generated"; exit 1; }
          if grep -q 'Unexpected error' github-metrics.svg; then echo "::error::plugin error inside dashboard card, keeping previous image"; exit 1; fi
          test -s top-langs.svg || { echo "::error::top-langs.svg was not generated"; exit 1; }
          if grep -q -i 'Something went wrong' top-langs.svg; then echo "::error::top-langs card is an error card, keeping previous image"; exit 1; fi
          echo "dashboard: $(wc -c < github-metrics.svg) bytes, top-langs: $(wc -c < top-langs.svg) bytes"
      - name: Commit to metrics branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg top-langs.svg
          git commit -m "chore: update metrics" || { echo "no change"; exit 0; }
          git push origin HEAD:metrics
