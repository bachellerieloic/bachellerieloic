name: Snake
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bachellerieloic
          outputs: |
            dist/github-snake.svg?color_snake=#1b4332&color_dots=#ebedf0,#c5dacb,#8fbaa0,#4f8a68,#1b4332
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e0af2a&color_dots=#161b22,#1e3d2d,#2d6a4f,#52a877,#74c69d
      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "chore: update snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
